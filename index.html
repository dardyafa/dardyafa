<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Dyafa | الموقع مغلق مؤقتاً</title>
    <!-- Website Favicon Logo -->
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0f0d0c;
            --card: #191513;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text: #f5f2eb;
            --muted: #a69e8e;
            --border: rgba(212, 175, 55, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, rgba(212,175,55,0.12), #0f0d0c 70%);
        }
        .lock-container {
            background: var(--card);
            border: 2px solid var(--gold);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .lock-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(212,175,55,0.3);
        }
        /* إيموجي الأشغال المتحرك 3D */
        .animated-emoji {
            font-size: 64px;
            margin: 15px 0;
            display: inline-block;
            animation: bounceAndRotate 2s infinite ease-in-out;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
        }
        @keyframes bounceAndRotate {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }
        h1 {
            color: var(--gold-light);
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .agency-link {
            display: inline-block;
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            margin: 15px 0 25px 0;
            border-bottom: 1px dashed var(--gold);
            padding-bottom: 3px;
            transition: 0.3s;
        }
        .agency-link:hover {
            color: #fff;
            border-color: #fff;
        }
        .contact-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn-action {
            background: #25d366;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }
        .btn-action:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--muted);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="lock-container">
        <!-- Logo Dar Dyafa -->
        <img src="assets/images/logo.png" alt="Dar Dyafa Logo" class="logo-img" onerror="this.src='assets/images/logo.jpg'">
        
        <!-- 3D Animated Construction Emoji -->
        <div>
            <span class="animated-emoji">🏗️</span>
        </div>

        <!-- Main Warning Message -->
        <h1>الموقع مغلق، يجب تسوية الوضعية مع وكالة Brandirasck لِإتمام العمل</h1>

        <!-- Agency Link -->
        <div>
            <a href="https://www.brandirasck.site" target="_blank" class="agency-link">
                <i class="fa-solid fa-globe"></i> www.brandirasck.site
            </a>
        </div>

        <!-- WhatsApp Direct Contact -->
        <div class="contact-box">
            <a href="https://wa.me/212605320470" target="_blank" class="btn-action">
                <i class="fa-brands fa-whatsapp" style="font-size:1.4rem;"></i>
                تواصل معنا عبر واتساب الوكالة: +212 605-320470
            </a>
        </div>

        <div class="footer-note">
            © 2026 BRANDIRASCK Agency. All Rights Reserved.
        </div>
    </div>

</body>
</html>
