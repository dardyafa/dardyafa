            --border: rgba(212, 175, 55, 0.25);

        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, rgba(212,175,55,0.12), transparent 60%);
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 36px;

        }
        .login-card h2 { color: var(--gold); text-align: center; margin-bottom: 8px; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--gold); font-weight: 600; }
        .input-group input, .input-group select, .input-group textarea {

            border: 1px solid rgba(255,255,255,0.15); background: #0b0a09; color: #fff; font-size: 0.95rem;
        }
        .btn {
            background: var(--gold); color: #0f0d0c; border: none; padding: 11px 18px;
            border-radius: 10px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { opacity: 0.92; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-secondary { background: #2a2421; color: #fff; border: 1px solid var(--border); }
        .btn-ai { background: #7c3aed; color: #fff; }

        .dashboard { display: none; }
        .topbar {
            background: #14110f; border-bottom: 1px solid var(--border);
            padding: 16px 4%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .nav-pills {
            display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 4%; background: #120f0e; border-bottom: 1px solid rgba(255,255,255,0.06);
        }

            background: #1c1816; color: var(--muted); cursor: pointer; font-weight: 700; font-size: 0.88rem;
